plugins { id 'com.android.application' }
android {
    namespace 'org.rcport.diagnostic'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.rcport.diagnostic'
        minSdk 26
        targetSdk 35
        versionCode 53
        versionName '0.49.0-campaign'
        ndk { abiFilters.addAll((project.findProperty('rcAbis') ?: 'arm64-v8a').split(',')) }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

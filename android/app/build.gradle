plugins { id 'com.android.application' }
android {
    if(project.hasProperty('rcAcceptanceSources')) {
        sourceSets.debug.java.srcDir(project.property('rcAcceptanceSources')+'/java')
        sourceSets.debug.manifest.srcFile(project.property('rcAcceptanceSources')+'/AndroidManifest.xml')
    }
    namespace 'org.rcport.diagnostic'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.rcport.diagnostic'
        minSdk 26
        targetSdk 35
        versionCode 64
        versionName '0.60.0-ambient-lifecycle'
        ndk { abiFilters.addAll((project.findProperty('rcAbis') ?: 'arm64-v8a').split(',')) }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
